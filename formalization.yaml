# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: Unrestricted Boolean multiplicative complexity of the 3x3 low-half multiplier
  description: >-
    The target lowMul3 is the three low bits of the product of two 3-bit integers.
    The unrestricted XOR–AND circuit model of arXiv:2608.30238, Definition 2.1,
    allows AND gates to reuse nonlinear intermediate outputs.
    The development proves MC(lowMul3) = 6 using an explicit six-gate circuit
    for the upper bound and a normal form with five cases (lambda = 5, 4, 3, 2, 1)
    for the lower bound.
    LowHalfMul3Solution proves mc_lowMul3 using only propext, Classical.choice
    and Quot.sound.
  authors:
    - Bshara Alhodali  # ORCID 0009-0003-4870-8745
  responsible_maintainers:
    - Bshara Alhodali  # ORCID 0009-0003-4870-8745
  license: MIT
classification:
  arxiv: [cs.CC]
  msc2020: [68Q06, 68Q17, 94D10]
sources:
    - title: The multiplicative complexity of the three-bit low-half multiplier
    authors:
      - Bshara Alhodali  # ORCID 0009-0003-4870-8745
      - Gregory Morse  # ORCID 0000-0002-0231-6557
    id: arXiv:2611.15992
    location: https://arxiv.org/abs/2611.15992
    type: paper
    relationship: formalizes
    note: >-
      Formalizes the upper bound, the circuit normal form, and all five
      lower-bound cases (lambda = 5, 4, 3, 2, 1). LaTeX source:
      https://github.com/bishara74/Multiplicative-complexity-of-the-3-bit-low-half-multiplier
  - title: >-
      Unrestricted Boolean Multiplicative Complexity of Four-Term Binary
      Polynomial Multiplication: Rational Places, Hasse Jets, and the
      Failure of Nonlinear Feedback
    authors: [Gregory Morse]
    id: arXiv:2608.30238v1
    location: https://arxiv.org/abs/2608.30238v1
    type: paper
    relationship: background
    note: >-
      Definition 2.1 supplies the circuit model. The target here is not a
      target of that paper: lowMul3 keeps only the three low coefficients of
      the three-term product and adds the integer carry a0a1b0b1 to
      coefficient 2. Source-author endorsement is unrecorded.
    license: CC-BY-4.0
    author_endorsement: other
related_formalizations:
  - id: https://github.com/GregoryMorse/unrestricted-boolean-mul
    relationship: builds-on
    note: >-
      The model, the ANF layer, the Circuit structure, MC and the aVar/bVar/Mul
      targets are imported from that package at the revision pinned in
      lake-manifest.json; they are not re-formalized here.
status:
  scope: >-
    The exact value MC(lowMul3) = 6 is fully formalized in Lean 4. The upper
    bound is an explicit unrestricted six-gate circuit. The lower bound
    uses normal_form_five and all five LambdaCase theorems. The final
    AxiomAudit.lean run covers 264 theorems, including mc_lowMul3, and uses
    only propext, Classical.choice and Quot.sound. Finite facts use plain
    kernel-checked decide. The separate LowHalfMul3Challenge.lean retains
    the single deliberate statement hole. The Solution does not import it.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models:
        - AI coding assistant session, directed and reviewed by the author
      framework: Lean 4.35.0-rc3 with Mathlib
      tool_setup: >-
        Ordinary Lean tactics and kernel checking only. The 64-input
        correctness check and the Boolean identity for the last recombination
        are discharged by the `decide` tactic over the finite input type,
        which the kernel replays; no decision bridge and no custom axiom.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: local Windows build, lake build with the prebuilt Mathlib cache
      prompting_notes: >-
        Human-directed, commit-sized steps; proof-boundary audits recorded in
        LEAN_LOG.md and AxiomAudit.lean.
  notes: >-
    The author directed and reviewed the development and assumes
    responsibility. No independent human peer review is claimed.
fidelity:
  divergences: |-
    - sec:preliminaries and l4:lem:support: Lean checks finite target identities and
      splittings. The manuscript uses column carries and support arguments.
    - toolkit:coset and toolkit:gram: Lean works over an abstract CosetBase and
      takes differences before using a finite Gram identity. The manuscript
      derives the identity using complementary minors of a kernel basis.
    - l3:lem:udir, l3:lem:third and l2:lem:cube: Lean checks the direction choices
      and the relevant cube values or sums by finite evaluation.
    - l2:lem:rankext and l2:lem:lastfactor: Lean checks the trivial radical
      finitely and packages the independent (0,1) last-factor case modulo
      the low-bit ideal.
    - l2:thm:main and l1:thm:main: Lean proves general tail reductions
      and invokes them from normalized-circuit wrappers.
review:
  status: self-assessed
  notes: >-
    The manuscript received a supervisor review, three independent
    pre-submission audits (verification/audit-v1/, verification/audit-v2/
    and verification/audit-v3/), and an arXiv submission audit.
    The supplied third report reviewed the fifth draft and identified
    two gaps due to a malformed definition, with no mathematical errors
    across the 39 numbered statements. Its findings informed later drafts.
    The repository records Lean kernel checks in AxiomAudit.lean.
