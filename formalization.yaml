# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: Unrestricted Boolean multiplicative complexity of the 3x3 low-half multiplier
  description: >-
    Formalizes the target lowMul3, the three low bits of the product of two
    3-bit integers (the product modulo 8), in the unrestricted XOR--AND
    circuit model of arXiv:2608.30238v1, where XOR and constants are free and
    either input of a paid AND gate may reuse arbitrary earlier nonlinear
    wires. Phase 1 proves that the three ANF coordinates agree with integer
    multiplication modulo 8 on all 64 inputs, and gives an explicit six-gate
    circuit, one of whose gates reuses two earlier nonlinear wires. Phase 2
    adds the derivative lemma (Lemma 8 of the attached note). Phase 3 proves
    the normal form (Lemma 1), Lemma 2, the pi2 / iota layer with Lemma 8 in
    the paper's form, Lemma 4 (kernel) and Lemma 6, excludes lambda = 5, and
    reduces MC(lowMul3) = 6 to four explicit statements. Phase 4 proves the
    four-linear-gate case (StarFree, Theorem 12 of the note). Phases 5 and 6
    prove the three-linear-gate case (lambdaCase_three), so MC(lowMul3) = 6
    follows in Lean from LambdaCase 1 and LambdaCase 2 alone
    (mc_eq_six_of_lambda_one_two). Phase 7 reduces the two-linear-gate case to
    one statement, TwoClaim (Proposition onehigh outside Lambda^2(U)). The unconditional claim MC(lowMul3) = 6 is
    only stated, as a deliberate hole.
  authors: [Bishara]
  responsible_maintainers: [Bishara]
  license: MIT
classification:
  arxiv: [cs.CC]
  msc2020: [68Q06, 68Q17, 94D10]
sources:
  - title: >-
      Unrestricted Boolean Multiplicative Complexity of Four-Term Binary
      Polynomial Multiplication: Rational Places, Hasse Jets, and the
      Failure of Nonlinear Feedback
    authors: [Gregory Morse]
    id: arXiv:2608.30238v1
    location: https://arxiv.org/html/2608.30238v1
    type: paper
    relationship: uses-model-of
    note: >-
      Definition 2.1 supplies the circuit model. The target here is not a
      target of that paper: lowMul3 keeps only the three low coefficients of
      the three-term product and adds the integer carry a0a1b0b1 to
      coefficient 2. No result of that paper is restated or reproved.
    license: CC-BY-4.0
    author_endorsement: none
  - title: A human proof of the four-linear-gate case for the 3x3 low-half multiplier
    authors: [Bishara]
    id: lambda4_proof.tex
    type: preprint
    relationship: formalizes
    note: >-
      Formalized: Lemma 1 (normal_form_five), Lemma 2 (wireSpace_eq_V4),
      Lemma 3 for the two instances used (lemma3), Lemma 4 kernel half
      (phi_eq_zero_iff), Lemma 6 (lemma6), Lemma 8 in the paper's form
      (derivative_lemma_paper), Lemma 11 as a normal form (types), and
      Theorem 12 (starFree, hence lambdaCase_four). Theorem 12 is proved by a
      shorter route than the note: a strengthened derivative lemma (Lemma 8',
      starFree_of_goodDir) plus Lemma 6 replaces Lemma 5, Proposition 7, the
      dimension half of Lemma 4 and the WLOG dim Q = 4; the three-term case
      follows the note. Not formalized (not needed on this route): Lemma 4
      dimension half, Lemma 5, Proposition 7.
related_formalizations:
  - id: https://github.com/GregoryMorse/unrestricted-boolean-mul
    relationship: depends-on
    note: >-
      The model, the ANF layer, the Circuit structure, MC and the aVar/bVar/Mul
      targets are imported from that package at the revision pinned in
      lake-manifest.json; they are not re-formalized here.
status:
  scope: >-
    Two proved theorems carry the content of phase 1: lowMul3_eval checks the
    three ANF coordinates against integer multiplication modulo 8 on all 64
    inputs, and upper exhibits a six-gate unrestricted circuit computing
    lowMul3. The exact value MC(lowMul3) = 6 is NOT proved: no lower bound
    argument is formalized, and the equality appears only as the single
    deliberate hole in LowHalfMul3Challenge.lean, which the library does not import.
    Phases 2-4 add lower-bound machinery: the normal form, Lemma 2, Lemma 8,
    the exclusion of lambda = 5, and Theorem 12 (starFree, the
    four-linear-gate case). Phases 5-6 prove LambdaCase 3 (lambdaCase_three:
    reduction lambdaCase_three_of, the general coset lemma b3Claim, Lemma A
    noPlace_z1_bad and Lemma C noPlace_z2_of_uDir for spaces without a good
    direction, hence badClaim). mc_eq_six_of_lambda_one_two derives
    MC(lowMul3) = 6 from LambdaCase 1 and LambdaCase 2, which are not yet
    proved. All 202 audited theorems share the
    axiom closure [propext, Classical.choice, Quot.sound]. Finite facts are
    checked by plain decide (kernel-checked). No use of
    native_decide or ofReduceBool, and no custom axiom.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models:
        - AI coding assistant session, directed and reviewed by the author
      framework: Lean 4.35.0-rc3 with Mathlib
      tool_setup: >-
        Ordinary Lean tactics and kernel checking only. The 64-input
        correctness check and the Boolean identity for the last recombination
        are discharged by the `decide` tactic over the finite input type,
        which the kernel replays; no decision bridge and no custom axiom.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: local Windows build, lake build with the prebuilt Mathlib cache
      prompting_notes: >-
        Human-directed, commit-sized steps; proof-boundary audits recorded in
        LEAN_LOG.md and AxiomAudit.lean.
  notes: >-
    The author directed and reviewed the development and assumes
    responsibility. No independent human peer review is claimed.
fidelity:
  divergences: >-
    lowMul3 is stated over ANF 6 while the imported aVar/bVar/Mul are stated
    over ANF (2 * 3); these index types are definitionally equal and Lean
    accepts the coercion-free statement. The SAT certificates and the human
    case analysis behind the value 6 are outside this Lean development.
    LambdaCase 3 (phase 5) follows lambda3_proof.tex with a shorter route:
    the dim Q3 = 3 reduction is not used; Lemma C for Q3 with a good
    direction and Proposition B (last gate after g3 places z1) are both
    obtained from Lemma 8' applied to Q' = Q3 + <Z1> (iota_e Z1 = 0), instead
    of Lemmas 5/6, D1 and Theorem 12; Lemmas A, C and D1 are needed only for
    Q3 without a good direction (BadClaim). Lemmas B3a/B3b are proved once
    for an abstract coset base (CosetBase: contains Aff, constant a2/b2
    derivatives, 1, a0, b0 in the radical of the carry pairing
    beta(u,v) = sum over U of u v), so dim Q and rank-2 generation play no
    role; the Pluecker step of B3a is the finite statement gram_finite
    (2^14 cases, plain decide) about U G = 0 for the 2x4 coefficient matrix
    U and the Gram matrix G of beta, instead of the kernel-basis computation.
    Lemma A for bad Q3 avoids the product lemma (P1-P3, radical lemma,
    weights): a direction e with a U-component and iota_e(Q3) in <l>,
    iota_e Z1 not in <l> (GenDir, built from the type normal forms) forces
    a z1-placement to vanish on a hyperplane {a = alpha}; Lemma W then makes
    Z1 + q a wedge, and goodDir_main gives a good direction.
    Lemma C for bad Q3 avoids 4-forms and Lemma D1: along the same
    U-direction e (UDir), D_e f and D_e h are constant on ker l, so on that
    hyperplane D_e z2 would have degree <= 2; but the third difference over a
    cube in ker l sees the carry derivative a0 b0 (e1 b1 + e4 a1) and equals 1.
    LambdaCase 2 (phase 7) is reduced to one statement, TwoClaim (Proposition
    onehigh of lambda2_proof.tex for P outside Lambda^2(U)), by a route that
    does not split on deg g2 and needs neither the replacement lemma nor
    Lemma P: if g2 places z1, then P outside Lambda^2(U) is excluded by Lemma
    A's derivative argument (a U-direction killing P exists, GenDir), Lemma W
    and Lemma 3, and P inside Lambda^2(U) by the coset lemma on V(S),
    S = Q + <Z1>; otherwise g3 places z1, so the space before the last gate
    lies in V(S) + <g2>, and Proposition onehigh finishes (inside Lambda^2(U)
    again the coset lemma).
    In Proposition onehigh, z2 not in V(S) + <g> uses Lemma 8' (S always has
    a good direction) instead of the quartic part of g; the case where both
    factors of the last gate lie in V(S) uses a 16-point cube sum over a cube
    in ker l (P vanishes there, and V(S) restricts to a space whose products
    have no quartic term), instead of the exterior statement P ^ theta != Omega.
review:
  status: self-assessed
  notes: >-
    Kernel-checked so far: the upper bound (upper), the reduction of
    MC(lowMul3) = 6 to the absence of five-gate circuits, the normal form,
    and the cases lambda = 5, 4 and 3 (lambdaCase_five, lambdaCase_four,
    lambdaCase_three). MC(lowMul3) = 6 therefore follows in Lean from
    LambdaCase 1 and LambdaCase 2 (mc_eq_six_of_lambda_one_two). LambdaCase 2
    is further reduced to one statement, TwoClaim (lambdaCase_two_of).
    LambdaCase 1 and TwoClaim are not yet formalized, and the unconditional statement in
    LowHalfMul3Challenge.lean is still a deliberate sorry. Several Lean proofs take
    shorter routes than the written notes (fidelity.divergences, LEAN_LOG.md).
    A supervisor review (November 2026) and two internal pre-submission audits
    of the paper (verification/audit-v1/, verification/audit-v2/) cover the
    mathematics; no independent
    review of the Lean development itself is claimed.
